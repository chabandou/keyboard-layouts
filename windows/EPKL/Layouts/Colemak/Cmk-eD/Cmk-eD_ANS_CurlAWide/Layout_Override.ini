;
; Personal Layout_Override for Cmk-eD_ANS_CurlAWide
; Ports linux/kanata/config.kbd (keyboard-layouts repo) into EPKL
; so kanata.exe can stay OFF (hook competition fix).
; Kanata source:
;  spc tap-hold 200 200 spc (layer-while-held extend)
;  a tap-hold a ralt | f tap-hold f lctl | k tap-hold k lctl | ' tap-hold ' rsft
; EPKL tapModTime is already 200ms in EPKL_Settings_Default.ini
;
; IMPORTANT - key names below are NOT physical keys:
;  - [layout] entries are remapped by mapSC_layout = Cmk-CAW-_ANS (Curl-DH + Angle + Wide).
;  - Extend entries are remapped by mapSC_extend = Ext-CAW-_ANS (V-B swap + Angle + Wide).
;  Kanata defsrc is physical, so each entry below is keyed by the PRE-remap key that
;  EPKL moves onto the wanted physical key. The physical key is noted in each comment.
;  Ext-CAW-_ANS (entry -> physical): 7>8 8>9 9>0 0>- ->= =>7 | Y>U U>I I>O O>P P>[ [>Y
;    ']>H H>J J>K K>L L>; ;>' '>] | N>M M>, ,>. .>/ />N | X>Z C>X B>C Z>B V>V
;
[pkl]
; keep base remaps from Layout.ini (Cmk-CAW, Ext-CAW); use our own Extend layer 1
ext1            = ext_Kanata

[layout]
; SC = VKEY      CStat Base Shift Ctrl AltGr AGrSh
; Physical A -> tap a, hold RAlt (kanata @a)
QW_A  = A/RAlt    	1   	a   	A   	--  	đ   	α
; Physical F -> tap t, hold LCtrl (kanata @f)
QW_F  = T/LCtrl    	5   	t   	T   	--  	þ   	Þ
; Physical K -> tap n, hold LCtrl (kanata @k). Entry QW_J lands on physical K (Wide).
QW_J  = N/LCtrl    	1   	n   	N   	--  	–   	↑
; Physical ' -> tap o, hold RShift (kanata @'). Entry QW_SC lands on physical ' (Wide).
QW_SC = O/RShift   	1   	o   	O   	--  	º   	ª
; Space -> tap Space, hold Extend (kanata @spc)
QWSPC = SPACE/Ext	0   	Spc 	Spc 	--  	Spc 	Spc

[ext_Kanata]
; Kanata `extend` layer. Unmapped keys send NOTHING in EPKL Extend, so kanata `_`
; (transparent) keys and keys outside defsrc are mapped explicitly to themselves.
;
; row1: _ f1 f2 f3 f4 f5 f6 f7 f8 f9 f10 f11 f12 _
QW_GR = SC029     	; phys `  : ` (transparent)
QW_1  = F1        	; phys 1
QW_2  = F2        	; phys 2
QW_3  = F3        	; phys 3
QW_4  = F4        	; phys 4
QW_5  = F5        	; phys 5
QW_6  = F6        	; phys 6
QW_PL = F7        	; phys 7
QW_7  = F8        	; phys 8
QW_8  = F9        	; phys 9
QW_9  = F10       	; phys 0
QW_0  = F11       	; phys -
QW_MN = F12       	; phys =
QWBSP = BackSpace 	; phys Bspc (transparent)
; row2: _ esc C-w C-f A-f4 C-t C-y pgup home up end S-ins C-] _
QW_Q  = Esc       	; phys Q
QW_W  = β^w       	; phys W
QW_E  = β^f       	; phys E
QW_R  = β!{F4}    	; phys R
QW_T  = β^t       	; phys T
QW_LB = β^y       	; phys Y
QW_Y  = PgUp      	; phys U
QW_U  = Home      	; phys I
QW_I  = Up        	; phys O
QW_O  = End       	; phys P
QW_P  = β+{Ins}   	; phys [
QW_QU = β^]       	; phys ]
QW_BS = SC02B     	; phys \  : \ (transparent)
; row3: _ lmet lalt lsft lctl _ bspc pgdn left down rght bspc _
QW_A  = LWin      	; phys A
QW_S  = LAlt      	; phys S
QW_D  = LShift    	; phys D
QW_F  = LCtrl     	; phys F
QW_G  = SC022     	; phys G  : g (transparent)
QW_RB = BackSpace 	; phys H
QW_H  = PgDn      	; phys J
QW_J  = Left      	; phys K
QW_K  = Down      	; phys L
QW_L  = Right     	; phys ;
QW_SC = BackSpace 	; phys '
QWENT = Enter     	; phys Enter (transparent)
; row4: _ C-z @scx @scc @scv C-b @s1 @s2 @s3 @s4 @s5 _
;  kanata scx/scc = M-x/M-c are Omarchy's universal cut/copy -> Ctrl+X/Ctrl+C on Windows
;  kanata s1..s5  = M-1..M-5 -> Win+1..Win+5
QW_X  = β^z       	; phys Z
QW_C  = β^x       	; phys X
QW_B  = β^c       	; phys C
QW_V  = β+{Ins}   	; phys V
QW_Z  = β^b       	; phys B
QW_SL = β#1       	; phys N
QW_N  = β#2       	; phys M
QW_M  = β#3       	; phys ,
QW_CM = β#4       	; phys .
QW_PD = β#5       	; phys /
; outside kanata defsrc (passed through by kanata)
QWESC = Esc
QW_F1 = F1
QW_F2 = F2
QW_F3 = F3
QW_F4 = F4
QW_F5 = F5
QW_F6 = F6
QW_F7 = F7
QW_F8 = F8
QW_F9 = F9
QWF10 = F10
QWF11 = F11
QWF12 = F12
QWINS = Ins
QWDEL = Del
QWHOM = Home
QWEND = End
QWPGU = PgUp
QWPGD = PgDn
QW_UP = Up
QW_DN = Down
QW_LE = Left
QW_RI = Right
