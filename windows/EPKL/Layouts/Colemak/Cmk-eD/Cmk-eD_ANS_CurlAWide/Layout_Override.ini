;
; Personal Layout_Override for Cmk-eD_ANS_CurlAWide
; Ports kanata config from C:\tools\kanata\config.kbd into EPKL
; so kanata.exe can stay OFF (hook competition fix).
; Kanata source:
;  spc tap-hold 200 200 spc (layer-while-held extend)
;  a tap-hold a ralt | f tap-hold f lctl | k tap-hold k lctl | ' tap-hold ' rsft
; EPKL tapModTime is already 200ms in EPKL_Settings_Default.ini
;
[pkl]
; keep base remaps from Layout.ini (Cmk-CAW, Ext-CAW)

[layout]
; SC = VKEY      CStat Base Shift Ctrl AltGr AGrSh
; Physical A -> tap a, hold RAlt (kanata @a)
QW_A  = A/RAlt    	1   	a   	A   	--  	đ   	α
; Physical F (Colemak T) -> tap t, hold LCtrl (kanata @f)
QW_F  = T/LCtrl    	5   	t   	T   	--  	þ   	Þ
; Physical K (Colemak E) -> tap e, hold LCtrl (kanata @k)
QW_K  = E/LCtrl    	1   	e   	E   	--  	€   	←
; Physical ' -> tap ', hold RShift (kanata @')
QW_QU = vc_QU/RShift	0   	'   	"   	--  	@0b4	′
; Space -> tap Space, hold Extend (kanata @spc)
QWSPC = SPACE/Extend	0   	Spc 	Spc 	--  	Spc 	Spc

[ext_NavEdit]
; Kanata extend layer port (positional, QWERTY physical):
; number row is already F1-F12 in Files\_eD_Extend.ini, re-assert here
Co_1  = F1
Co_2  = F2
Co_3  = F3
Co_4  = F4
Co_5  = F5
Co_6  = F6
Co_7  = F7
Co_8  = F8
Co_9  = F9
Co_0  = F10
Co_MN = F11
Co_PL = F12
; row2: esc C-w C-f A-F4 C-t C-y pgup home up end S-ins C-]
QW_Q  = Esc
QW_W  = β^w
QW_E  = β^f
QW_R  = β!{F4}
QW_T  = β^t
QW_Y  = β^y
QW_U  = PgUp
QW_I  = Home
QW_O  = Up
QW_P  = End
QW_LB = +{Ins}
QW_RB = β^]
; row3 home: lmet lalt lsft lctl _ bspc pgdn left down rght bspc
QW_A  = LWin
QW_S  = Alt
QW_D  = Shift
QW_F  = Ctrl
QW_H  = BackSpace
QW_J  = PgDn
QW_K  = Left
QW_L  = Down
QW_SC = Right
QW_QU = BackSpace
; row4: C-z M-x M-c S-ins C-b M-1 M-2 M-3 M-4 M-5
QW_Z  = β^z
QW_X  = β!x
QW_C  = β!c
QW_V  = +{Ins}
QW_B  = β^b
QW_N  = β!1
QW_M  = β!2
QW_CM = β!3
QW_PD = β!4
QW_SL = β!5
